<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institute for the Ecology of Meaning</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>/* Institute landing page. To change the rotations, edit the HERO, LEFT and RIGHT lists at the bottom. */
:root{
  --ground:#020202; --ink:#ece7d8; --muted:#9a9584; --line:#2b2a25;
  /* swatches: the globe model's palette */
  --rust:#b5552f; --amber:#d39a3a; --lichen:#c9c46a; --moss:#7f9a45; --fern:#3f8f5a; --teal:#3f9c94; --pink:#b8598f; --violet:#8a5fb0; --bone:#d8cfa6;
  --display:"Newsreader",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink)}
body{font-family:var(--mono);display:flex;flex-direction:column;min-height:100svh}
header{position:relative;z-index:1;padding:28px clamp(18px,4vw,56px) 0;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
h1{font-family:var(--display);font-weight:300;font-size:clamp(1.7rem,3.6vw,2.8rem);line-height:1.06;margin:0;letter-spacing:.005em;text-wrap:balance;max-width:15ch}
.sub{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero{flex:1;min-height:240px;position:relative;display:grid;place-items:center;padding:12px}
.hero > img,.flank{--d:min(74vmin,720px)}
/* size the dish to the space actually left between title and menu, so it never covers the menu on short windows */
@supports (height:1cqh){.hero{container-type:size}.hero > img,.flank{--d:min(100cqh,74vmin,720px)}}
.hero img{position:absolute;inset:0;margin:auto;width:var(--d);height:var(--d);object-fit:contain;opacity:0;transition:opacity 2.4s ease}
.hero img.on{opacity:1}
.flank{--half:calc(var(--d)/2);--gap:26px;position:absolute;top:50%;transform:translateY(-50%);height:min(calc(var(--d)*.68),440px);
  width:min(23vw,330px,calc(50vw - var(--half) - var(--gap) - 18px))}
/* each panel sits just outside the dish and its diagram hugs the inner edge */
.flank.l{right:calc(50% + var(--half) + var(--gap))} .flank.r{left:calc(50% + var(--half) + var(--gap))}
/* diagrams are black on white; inverted so they read as light lines on the dark ground (hue kept) */
.hero .flank img{position:absolute;inset:0;margin:auto;width:100%;height:100%;max-width:none;object-fit:contain;filter:invert(1) hue-rotate(180deg) contrast(1.05);mix-blend-mode:screen;opacity:0;transition:opacity 2.4s ease}
.hero .flank.l img{object-position:right center} .hero .flank.r img{object-position:left center}
.hero .flank img.on{opacity:.62}
@media (max-width:1100px){.flank{display:none}}
.hero .empty{color:var(--muted);font-size:.8rem;border:1px dashed var(--line);padding:18px 22px;max-width:44ch;text-align:center;line-height:1.5}
nav{position:relative;z-index:1;padding:0 clamp(18px,4vw,56px) 22px;display:flex;flex-wrap:wrap;gap:14px clamp(18px,3.4vw,44px);justify-content:center}
nav a{color:var(--ink);text-decoration:none;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid transparent}
nav a::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
nav a:hover,nav a:focus-visible{border-bottom-color:var(--c);outline:none}
.strip{display:flex;height:10px}
.strip i{flex:1}
footer{padding:12px clamp(18px,4vw,56px) 16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hero img{transition:none}}</style></head><body><header><h1>Institute for the Ecology of Meaning</h1></header><div class="hero" id="hero" role="img" aria-label="Rotating image of a mycelial network, flanked by diagrams of social and intellectual networks"><div class="flank l" id="flankL" aria-hidden="true"></div><div class="flank r" id="flankR" aria-hidden="true"></div></div><nav aria-label="Pages"><a href="mission.html" style="--c:var(--amber)">Mission</a> <a href="archival-intelligence.html" style="--c:var(--fern)">Archival Intelligence</a> <a href="daedala.html" style="--c:var(--pink)">Daedala</a> <a href="contact.html" style="--c:var(--bone)">Contact</a></nav><div class="strip" aria-hidden="true"><i style="background:var(--rust)"></i><i style="background:var(--amber)"></i><i style="background:var(--lichen)"></i><i style="background:var(--moss)"></i><i style="background:var(--fern)"></i><i style="background:var(--teal)"></i><i style="background:var(--violet)"></i><i style="background:var(--pink)"></i><i style="background:var(--bone)"></i></div><footer><span>Institute for the Ecology of Meaning</span><span>Images: SYS™, “mycelium network:abstraction” · Diagrams: R. Collins, P. Bourdieu, M. Grandjean · Site in preparation</span></footer><script>// Images to rotate.
const HERO=[1,2,3,4,5,6,7].map(n=>'media/files/mna-'+n+'.webp');
// Network diagrams either side (diagrams only). Shown on wide screens.
const LEFT=['media/files/diagram-collins-1.png','media/files/diagram-league-2.png','media/files/diagram-collins-3.png','media/files/diagram-league-4.png'];
const RIGHT=['media/files/diagram-league-1.png','media/files/diagram-collins-2.png','media/files/diagram-league-3.png','media/files/diagram-bourdieu.jpg'];
const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function rotate(box,list,seconds,delay){
  const imgs=[]; let cur=0;
  list.forEach((src,i)=>{const im=new Image(); im.alt=''; im.onload=()=>{imgs[i]=im; box.appendChild(im); if(!box.querySelector(':scope > img.on')) {im.classList.add('on'); cur=i;}}; im.src=src;});
  if(still) return;
  setTimeout(()=>setInterval(()=>{const ok=imgs.map((m,i)=>m?i:-1).filter(i=>i>=0); if(ok.length<2) return;
    imgs[cur]&&imgs[cur].classList.remove('on'); cur=ok[(ok.indexOf(cur)+1)%ok.length]; imgs[cur].classList.add('on');},seconds*1000),delay*1000);
}
rotate(document.getElementById('hero'),HERO,8,0);
rotate(document.getElementById('flankL'),LEFT,8,2.7);
rotate(document.getElementById('flankR'),RIGHT,8,5.3);</script></body></html>
